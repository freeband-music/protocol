openapi: 3.1.0
info:
  title: Freeband add-on protocol
  version: 0.3.0
  license:
    name: MIT
    identifier: MIT
  description: |
    An add-on is an HTTP server that answers JSON over GET with open CORS
    (`Access-Control-Allow-Origin: *`). It is identified by its manifest URL.

    Per-user configuration is one opaque path segment (base64url-encoded JSON)
    placed before every path below: `{base}/{config}/manifest.json`,
    `{base}/{config}/search`, and so on. Add-ons that need no configuration
    also serve the paths without that segment. The paths are declared here
    once, without the `{config}` segment.

    IDs are opaque prefixed strings. A client sends a request only to add-ons
    whose manifest declares the resource and a matching entry in `idPrefixes`.

    `protocolVersion` is semver. Additive changes keep the major version.
    Clients ignore unknown fields and refuse an add-on with a newer major
    version.

    Non-2xx responses carry an `ErrorResponse`.
servers:
  - url: "{baseUrl}"
    description: Add-on base URL, optionally ending in the config segment
    variables:
      baseUrl:
        default: http://localhost:8000
paths:
  /manifest.json:
    get:
      operationId: getManifest
      summary: Describe the add-on
      responses:
        "200":
          description: The add-on manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manifest"
        default:
          $ref: "#/components/responses/Error"
  /search:
    get:
      operationId: search
      summary: Search tracks, albums and artists
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [track, album, artist]
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        default:
          $ref: "#/components/responses/Error"
  /meta/artist/{id}:
    get:
      operationId: getArtist
      summary: Artist with album summaries
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The artist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artist"
        default:
          $ref: "#/components/responses/Error"
  /meta/album/{id}:
    get:
      operationId: getAlbum
      summary: Album with ordered track summaries
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The album
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Album"
        default:
          $ref: "#/components/responses/Error"
  /meta/track/{id}:
    get:
      operationId: getTrack
      summary: Track
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The track
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Track"
        default:
          $ref: "#/components/responses/Error"
  /stream/track/{id}:
    get:
      operationId: getTrackStreams
      summary: Streams for a track, best first
      description: >-
        The app passes the track's details as query parameters, so a stream
        add-on needs no metadata lookup and works with any metadata add-on.
        The `id` is opaque to stream add-ons; it may be used as a cache key.
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: title
          in: query
          required: true
          description: Track title.
          schema:
            type: string
        - name: artist
          in: query
          required: true
          description: Track artist name. Repeat the parameter for several artists, main artist first.
          schema:
            type: array
            items:
              type: string
        - name: albumTitle
          in: query
          required: false
          description: Title of the album the track is being played from, when known.
          schema:
            type: string
        - name: albumArtist
          in: query
          required: false
          description: Album artist name, when it differs from the track artist.
          schema:
            type: string
        - name: trackNumber
          in: query
          required: false
          description: Position on the disc; may be non-numeric, for example "A2".
          schema:
            type: string
        - name: discNumber
          in: query
          required: false
          description: Disc number.
          schema:
            type: integer
        - name: trackCount
          in: query
          required: false
          description: Number of tracks on the album, when known.
          schema:
            type: integer
        - name: durationMs
          in: query
          required: false
          description: Track duration in milliseconds.
          schema:
            type: integer
        - name: year
          in: query
          required: false
          description: Album release year.
          schema:
            type: integer
        - name: isrc
          in: query
          required: false
          description: International Standard Recording Code, when the metadata add-on knows it.
          schema:
            type: string
        - name: queue
          in: query
          required: false
          description: >-
            Whether the add-on may start preparing the track when nothing is
            playable yet. When `false`, the add-on must not start any work
            that changes state elsewhere or outlives the request (no
            downloads, nothing put in a queue): it answers `ok` with the streams that are playable
            right now, or `not_found`, and never `queued`. A `not_found`
            answer to such a request says only that nothing is playable
            immediately; the same request with `queue` left at `true` may
            still find or prepare a stream. Clients use `false` to look ahead,
            for example to check a whole play queue without side effects.
            Added in 0.3.0; older add-ons ignore it.
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Stream candidates and their status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamResponse"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Opaque prefixed ID
      schema:
        type: string
  responses:
    Error:
      description: Any non-2xx response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Manifest:
      type: object
      required: [id, name, version, protocolVersion, resources, idPrefixes]
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string
        description:
          type: string
        protocolVersion:
          type: string
          description: Semver of the protocol the add-on implements
        resources:
          type: array
          items:
            type: string
            enum: [search, meta, stream]
        idPrefixes:
          type: array
          description: >-
            ID prefixes this add-on answers for. An empty array means any ID,
            which is the norm for stream add-ons.
          items:
            type: string
        configurable:
          type: boolean
        configurationRequired:
          type: boolean
    ArtistSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        image:
          type: string
          format: uri
    AlbumSummary:
      type: object
      required: [id, title, artists]
      properties:
        id:
          type: string
        title:
          type: string
        artists:
          type: array
          items:
            $ref: "#/components/schemas/ArtistSummary"
        year:
          type: integer
        trackCount:
          type: integer
          description: Number of tracks on the album, when known.
        cover:
          type: string
          format: uri
    TrackSummary:
      type: object
      required: [id, title, artists]
      properties:
        id:
          type: string
        title:
          type: string
        artists:
          type: array
          items:
            $ref: "#/components/schemas/ArtistSummary"
        album:
          $ref: "#/components/schemas/AlbumSummary"
        trackNumber:
          type: string
          description: Position on the disc; may be non-numeric, for example "A2"
        discNumber:
          type: integer
        durationMs:
          type: integer
        isrc:
          type: string
          description: International Standard Recording Code, when known.
    Artist:
      allOf:
        - $ref: "#/components/schemas/ArtistSummary"
        - type: object
          required: [albums]
          properties:
            albums:
              type: array
              items:
                $ref: "#/components/schemas/AlbumSummary"
    Album:
      allOf:
        - $ref: "#/components/schemas/AlbumSummary"
        - type: object
          required: [tracks]
          properties:
            tracks:
              type: array
              description: Ordered as on the album
              items:
                $ref: "#/components/schemas/TrackSummary"
    Track:
      allOf:
        - $ref: "#/components/schemas/TrackSummary"
    SearchResponse:
      type: object
      required: [tracks, albums, artists]
      properties:
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/TrackSummary"
        albums:
          type: array
          items:
            $ref: "#/components/schemas/AlbumSummary"
        artists:
          type: array
          items:
            $ref: "#/components/schemas/ArtistSummary"
    Quality:
      type: object
      required: [codec, lossless]
      properties:
        codec:
          type: string
        bitrateKbps:
          type: integer
        lossless:
          type: boolean
        bitDepth:
          type: integer
          description: Bits per sample when known, e.g. 16 or 24.
        sampleRateHz:
          type: integer
          description: Sample rate when known, e.g. 44100 or 96000.
    Match:
      type: object
      required: [confidence, kind]
      properties:
        confidence:
          type: number
          minimum: 0
          maximum: 1
        kind:
          type: string
          enum: [exact, edition, loose]
    Stream:
      type: object
      description: One playable source, reached through its `url`.
      required: [title, quality, match, url]
      properties:
        title:
          type: string
        sizeBytes:
          type: integer
        quality:
          $ref: "#/components/schemas/Quality"
        match:
          $ref: "#/components/schemas/Match"
        url:
          type: string
          format: uri
    StreamResponse:
      type: object
      required: [status, streams]
      properties:
        status:
          type: string
          enum: [ok, queued, not_found]
          description: >-
            `ok`: at least one stream is ready to play. `queued`: nothing is
            playable yet, but the add-on has started preparing the track; ask
            again later (never sent when the request had `queue=false`).
            `not_found`: nothing playable for this request.
        message:
          type: string
        streams:
          type: array
          description: Ordered best first
          items:
            $ref: "#/components/schemas/Stream"
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
